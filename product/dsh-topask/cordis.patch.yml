# TopAsk white-label layer over the shipped web profile.
#
# The DeepSeek kernel stays as shipped: model routes, account, tools,
# persistence, and telemetry rows are untouched. This layer replaces brand
# presentation only, so it applies after dsh-base and dsh-web-app.
#
# A patch replaces a targeted row's whole config; these operations either
# disable a row or insert a new one, so no existing config is restated.

- id: ui-brand-official
  disabled: true

- insert:
    - id: topask-brand
      name: '@topask/dsh-topask'

    # TopAsk account provider: the same Platform protocol as the shipped
    # DeepSeek row, mounted under its own service key and credential scope so
    # both sign-in entries can coexist and either one can be disabled later.
    - id: topask-account
      name: '@deepseek-ai/dsh-deepseek-account-platform'
      config:
        serviceKey: topaskAccount
        providerLabel: TopAsk
        credentialScope: topask-account-platform
        callbackPath: /oauth/topask/callback
        platformOrigin: !!js process.env.TOPASK_PLATFORM_ORIGIN ?? 'http://127.0.0.1:8791'
        inferenceOrigin: !!js process.env.TOPASK_INFERENCE_ORIGIN ?? 'http://127.0.0.1:8790'
        # Development default: the service runs on loopback HTTP. Production
        # deployments use an HTTPS origin and set this to false.
        allowLoopbackHttp: true
